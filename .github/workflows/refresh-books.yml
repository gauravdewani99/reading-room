name: Refresh books

# Pulls the Goodreads shelves every night and commits the result when something changed.
# Vercel is connected to this repo, so the push is what redeploys the site.
on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC, off the hour to avoid the scheduler's busiest slot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-books
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch shelves from Goodreads
        run: npm run books
        env:
          GOODREADS_USER_ID: '130258841'

      # never push data the site cannot build with
      - run: npm run build

      - name: Commit if the library changed
        run: |
          git add public/books.json public/covers scripts/.ol-cache.json
          if git diff --cached --quiet; then
            echo "Library unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh books from Goodreads"
          git push
